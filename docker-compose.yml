services:
  # Development service - uses volume mounts for hot reload
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
      - ../otahoas_vanha:/home/node/otahoas_vanha
    working_dir: /home/node/app/
    stdin_open: true
    tty: true
    command: sh -c "pnpm install && yes | pnpm dev"
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      - COREPACK_ENABLE_DOWNLOAD_PROMPT=0

  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: payload
    volumes:
      - data:/var/lib/postgresql/data

volumes:
  data:
    name: otahoas_postgres_data
  node_modules:
